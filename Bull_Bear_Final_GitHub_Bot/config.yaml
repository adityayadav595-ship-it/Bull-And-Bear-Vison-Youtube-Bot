sources_file: approved_sources.txt
history_file: uploaded_ids.txt
hash_history_file: uploaded_hashes.txt

youtube:
  privacy: private
  made_for_kids: false
  contains_synthetic_media: false
  language: en

metadata:
  category_id: "27"
  max_tags: 6

discovery:
  exact_pin_sources_only: true
  max_candidates_per_source: 10
  min_duration_seconds: 8
  max_duration_seconds: 60
  smart_pool_size: 8
  max_candidate_attempts_per_run: 3

safety:
  # Generic handoff defaults: channel is active, but the bot starts in review-only mode.
  channel_state: active
  run_mode: review
  manual_approval_required: true
  approvals_file: approved_uploads.txt
  review_queue_file: review_queue.jsonl
  review_queue_size: 10

  # Anti-repetition / anti-spam guardrails.
  min_hours_between_uploads: 6
  metadata_history_file: metadata_history.jsonl
  metadata_similarity_threshold: 0.82
  max_hashtags: 3
