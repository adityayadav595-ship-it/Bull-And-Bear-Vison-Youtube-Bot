name: Bull and Bear Vision - Dual Channel Autorun

on:
  workflow_dispatch:
  schedule:
    # Fresh scheduler registration. Every 3 hours at :23 UTC.
    - cron: "23 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: write

concurrency:
  group: bull-and-bear-vision-dual-channel
  cancel-in-progress: false

jobs:
  channel-1:
    name: Channel 1 Upload
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: Bull_Bear_Final_GitHub_Bot
        run: pip install -r requirements.txt

      - name: Run Channel 1 uploader
        working-directory: Bull_Bear_Final_GitHub_Bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.BOT_YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.BOT_YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.BOT_YOUTUBE_REFRESH_TOKEN }}
          CHANNEL_STATE: ${{ vars.CHANNEL_STATE || 'active' }}
          BOT_RUN_MODE: "upload"
          I_HAVE_RIGHTS_TO_REPOST: "true"
          MANUAL_APPROVAL_REQUIRED: "false"
          CHANNEL_BRAND: "Bull and Bear Vision"
          YOUTUBE_PRIVACY: "public"
          MADE_FOR_KIDS: "false"
          CONTAINS_SYNTHETIC_MEDIA: "false"
        run: python app.py

      - name: Save Channel 1 and shared duplicate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Bull_Bear_Final_GitHub_Bot/review_queue.jsonl \
            Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt \
            Bull_Bear_Final_GitHub_Bot/uploaded_hashes.txt \
            Bull_Bear_Final_GitHub_Bot/metadata_history.jsonl \
            Bull_Bear_Final_GitHub_Bot/invalid_pins.txt \
            Bull_Bear_Final_GitHub_Bot/pin_failures.txt \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Channel 1 upload/history change."
            exit 0
          fi
          git commit -m "Update Channel 1 and shared duplicate history"
          git pull --rebase origin main
          git push origin main

  channel-2:
    name: Channel 2 Upload
    needs: channel-1
    if: ${{ always() && needs.channel-1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main after Channel 1
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: Bull_Bear_Final_GitHub_Bot
        run: pip install -r requirements.txt

      - name: Run Channel 2 uploader
        working-directory: Bull_Bear_Final_GitHub_Bot
        env:
          CONFIG_FILE: "config_channel2.yaml"
          YOUTUBE_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          CHANNEL_BRAND: "Bull & Bear Vision"
          CHANNEL_STATE: "active"
          BOT_RUN_MODE: "upload"
          I_HAVE_RIGHTS_TO_REPOST: "true"
          MANUAL_APPROVAL_REQUIRED: "false"
          YOUTUBE_PRIVACY: "public"
          MADE_FOR_KIDS: "false"
          CONTAINS_SYNTHETIC_MEDIA: "false"
        run: python app.py

      - name: Save Channel 2 and shared duplicate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Bull_Bear_Final_GitHub_Bot/review_queue_channel2.jsonl \
            Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt \
            Bull_Bear_Final_GitHub_Bot/uploaded_hashes.txt \
            Bull_Bear_Final_GitHub_Bot/metadata_history_channel2.jsonl \
            Bull_Bear_Final_GitHub_Bot/invalid_pins.txt \
            Bull_Bear_Final_GitHub_Bot/pin_failures.txt \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Channel 2 upload/history change."
            exit 0
          fi
          git commit -m "Update Channel 2 and shared duplicate history"
          git pull --rebase origin main
          git push origin main
