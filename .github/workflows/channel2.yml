name: YouTube Channel 2 - Separate Uploader

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, offset from Channel 1 so both channels do not run together.
    - cron: "37 2,5,8,11,14,17,20,23 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-channel-2-uploader
  cancel-in-progress: false

jobs:
  channel-2-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: Bull_Bear_Final_GitHub_Bot
        run: pip install -r requirements.txt

      - name: Run Channel 2 uploader
        working-directory: Bull_Bear_Final_GitHub_Bot
        env:
          CONFIG_FILE: "config_channel2.yaml"
          YOUTUBE_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          CHANNEL_BRAND: ${{ vars.CHANNEL2_BRAND || 'Channel 2' }}
          CHANNEL_STATE: "active"
          BOT_RUN_MODE: "upload"
          I_HAVE_RIGHTS_TO_REPOST: "true"
          MANUAL_APPROVAL_REQUIRED: "false"
          YOUTUBE_PRIVACY: "public"
          MADE_FOR_KIDS: "false"
          CONTAINS_SYNTHETIC_MEDIA: "false"
        run: python app.py

      - name: Save Channel 2 upload history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Bull_Bear_Final_GitHub_Bot/review_queue_channel2.jsonl \
            Bull_Bear_Final_GitHub_Bot/uploaded_ids_channel2.txt \
            Bull_Bear_Final_GitHub_Bot/uploaded_hashes_channel2.txt \
            Bull_Bear_Final_GitHub_Bot/metadata_history_channel2.jsonl \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Channel 2 upload/history change."
            exit 0
          fi

          git commit -m "Update Channel 2 upload history"
          git pull --rebase origin main
          git push origin main
