name: Bull Bear YouTube Bot - Safe Review Runner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. The bot may inspect sources every 3 hours,
    # but upload gates/cooldowns are enforced inside the app.
    - cron: "30 */3 * * *"

permissions:
  contents: write

concurrency:
  group: bull-bear-youtube-uploader
  cancel-in-progress: false

jobs:
  review-or-private-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: Bull_Bear_Final_GitHub_Bot
        run: pip install -r requirements.txt

      - name: Run review-first policy-safe bot
        working-directory: Bull_Bear_Final_GitHub_Bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # Safe defaults. Repository variables can be changed only after
          # YouTube restores/confirms the channel is permitted to operate.
          CHANNEL_STATE: ${{ vars.CHANNEL_STATE || 'suspended' }}
          BOT_RUN_MODE: ${{ vars.BOT_RUN_MODE || 'review' }}
          I_HAVE_RIGHTS_TO_REPOST: ${{ vars.I_HAVE_RIGHTS_TO_REPOST || 'false' }}
          MANUAL_APPROVAL_REQUIRED: "true"

          CHANNEL_BRAND: "Bull & Bear Vision"
          YOUTUBE_PRIVACY: "private"
          MADE_FOR_KIDS: "false"
          CONTAINS_SYNTHETIC_MEDIA: "false"
        run: python app.py

      - name: Save review queue and safe history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Bull_Bear_Final_GitHub_Bot/review_queue.jsonl \
            Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt \
            Bull_Bear_Final_GitHub_Bot/uploaded_hashes.txt \
            Bull_Bear_Final_GitHub_Bot/metadata_history.jsonl \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No review/history change."
            exit 0
          fi

          git commit -m "Update bot review queue and safe history"
          git pull --rebase origin main
          git push origin main
