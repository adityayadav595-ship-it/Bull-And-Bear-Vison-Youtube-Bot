name: Bull Bear YouTube Bot

on:
  workflow_dispatch:
  schedule:
    # Safety-first cadence: one automatic upload per day.
    # GitHub cron uses UTC. 15:30 UTC = 9:00 PM IST.
    # Scheduled uploads are UNLISTED so they can be reviewed in YouTube Studio before publishing.
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: bull-bear-youtube-uploader
  cancel-in-progress: false

jobs:
  upload-one-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: Bull_Bear_Final_GitHub_Bot
        run: pip install -r requirements.txt

      - name: Run bot
        working-directory: Bull_Bear_Final_GitHub_Bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          I_HAVE_RIGHTS_TO_REPOST: "true"
          CHANNEL_BRAND: "Bull & Bear Vision"
          # Safety mode: never auto-publish directly to the public channel.
          # Review each upload in YouTube Studio, then publish it manually if compliant.
          YOUTUBE_PRIVACY: "unlisted"
          MADE_FOR_KIDS: "false"
          CONTAINS_SYNTHETIC_MEDIA: "false"
        run: python app.py

      - name: Save upload history
        run: |
          if git diff --quiet -- Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt; then
            echo "No history change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt
          git commit -m "Update uploaded video history"
          git pull --rebase origin main
          git push origin main
