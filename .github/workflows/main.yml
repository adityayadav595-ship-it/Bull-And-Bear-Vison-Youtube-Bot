name: Bull Bear YouTube Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Runs every 3 hours.
    # All bot uploads remain PRIVATE for manual review in YouTube Studio.
    - cron: "30 */3 * * *"

permissions:
  contents: write

concurrency:
  group: bull-bear-youtube-uploader
  cancel-in-progress: false

jobs:
  upload-one-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: Bull_Bear_Final_GitHub_Bot
        run: pip install -r requirements.txt

      - name: Run policy-safe private uploader
        working-directory: Bull_Bear_Final_GitHub_Bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          I_HAVE_RIGHTS_TO_REPOST: "true"
          CHANNEL_BRAND: "Bull & Bear Vision"
          YOUTUBE_PRIVACY: "private"
          MADE_FOR_KIDS: "false"
          CONTAINS_SYNTHETIC_MEDIA: "false"
        run: python app.py

      - name: Save upload history
        run: |
          if git diff --quiet -- Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt Bull_Bear_Final_GitHub_Bot/uploaded_hashes.txt; then
            echo "No history change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Bull_Bear_Final_GitHub_Bot/uploaded_ids.txt Bull_Bear_Final_GitHub_Bot/uploaded_hashes.txt
          git commit -m "Update uploaded video history"
          git pull --rebase origin main
          git push origin main
